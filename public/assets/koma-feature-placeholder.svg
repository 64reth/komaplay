<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">KOMA://PLAY editorial placeholder</title>
  <desc id="desc">A cream, black and red editorial panel placeholder for KOMA://PLAY features.</desc>
  <rect width="1200" height="760" fill="#f3ead8"/>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 0.07"/></feComponentTransfer>
  </filter>
  <rect width="1200" height="760" filter="url(#grain)" opacity="0.5"/>
  <path d="M110 112h980v536H110z" fill="none" stroke="#171411" stroke-width="16"/>
  <path d="M155 155h175M155 155v120M870 605h175M1045 485v120" fill="none" stroke="#c8271d" stroke-width="18" stroke-linecap="square"/>
  <g fill="#171411">
    <rect x="182" y="232" width="836" height="92"/>
    <rect x="182" y="424" width="646" height="32"/>
    <rect x="182" y="482" width="510" height="32"/>
  </g>
  <text x="180" y="394" fill="#171411" font-family="Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif" font-size="118" font-weight="900" letter-spacing="-2">KOMA://PLAY</text>
  <text x="184" y="568" fill="#c8271d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="34" font-weight="800" letter-spacing="7">EDITORIAL PANEL</text>
</svg>
